services:
  - type: web
    name: group-food-recommender-study
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: changeme123
      - key: DATABASE_URL
        fromDatabase:
          name: study-db
          property: connectionString

databases:
  - name: study-db
    plan: free